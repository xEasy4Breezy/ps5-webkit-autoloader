name: Update itsPLK Releases

on:
  workflow_dispatch: # Manual trigger only

permissions:
  contents: write
  workflows: write   # Required to push commits/tags containing .github/workflows changes

jobs:
  sync-releases:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_REPO: 'itsPLK/ps5-webkit-autoloader'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Git Tags and Commits
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          # Fetch all branches and tags from upstream so tag commit SHAs exist locally
          git fetch upstream --tags --force
          git push origin --tags --force || echo "Tags pushed with warnings, continuing..."

      - name: Mirror Releases & Assets
        run: |
          set -euo pipefail

          echo "Target repo: $GITHUB_REPOSITORY"
          echo "Upstream repo: $UPSTREAM_REPO"

          # 1. Fetch tags from upstream releases
          UPSTREAM_TAGS=$(gh release list -R "$UPSTREAM_REPO" --limit 500 --json tagName -q '.[].tagName')

          # 2. Iterate and copy ONLY releases missing from your fork
          for tag in $UPSTREAM_TAGS; do
            # Skip if the release is already published in your fork
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "[-] Skipping: Release '$tag' already exists in $GITHUB_REPOSITORY."
              continue
            fi

            echo "[+] Syncing missing release: $tag"
            TMP_DIR="release_assets_${tag}"
            mkdir -p "$TMP_DIR"

            # Download release binaries (ignore failures if only source archives exist)
            gh release download "$tag" -R "$UPSTREAM_REPO" -D "$TMP_DIR" || echo "No downloadable binary assets found."

            # Fetch release metadata from upstream
            TITLE=$(gh release view "$tag" -R "$UPSTREAM_REPO" --json name -q '.name')
            IS_PRERELEASE=$(gh release view "$tag" -R "$UPSTREAM_REPO" --json isPrerelease -q '.isPrerelease')
            gh release view "$tag" -R "$UPSTREAM_REPO" --json body -q '.body' > "$TMP_DIR/notes.md"

            FLAGS=()
            if [ "$IS_PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            fi

            # Resolve the exact commit SHA for the tag to satisfy target_commitish
            TARGET_COMMIT=$(git rev-list -n 1 "$tag" 2>/dev/null || echo "")
            if [ -n "$TARGET_COMMIT" ]; then
              FLAGS+=(--target "$TARGET_COMMIT")
            fi

            # Collect downloaded assets (excluding notes.md and handling empty folders cleanly)
            shopt -s nullglob
            ASSETS=()
            for file in "$TMP_DIR"/*; do
              if [ -f "$file" ] && [ "$(basename "$file")" != "notes.md" ]; then
                ASSETS+=("$file")
              fi
            done
            shopt -u nullglob

            # Publish the release
            gh release create "$tag" \
              -R "$GITHUB_REPOSITORY" \
              --title "${TITLE:-$tag}" \
              --notes-file "$TMP_DIR/notes.md" \
              "${FLAGS[@]}" \
              "${ASSETS[@]}"

            rm -rf "$TMP_DIR"
            echo "Successfully mirrored $tag"
          done
